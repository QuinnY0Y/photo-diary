name: Deploy web preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm export:web
      - name: Publish icon font outside pnpm's hidden directory
        shell: bash
        run: |
          icon_font="$(find dist/assets -type f -name 'Ionicons*.ttf' -print -quit)"
          test -n "$icon_font"
          mkdir -p dist/assets/fonts
          public_font="dist/assets/fonts/$(basename "$icon_font")"
          cp "$icon_font" "$public_font"
          old_path="/photo-diary/${icon_font#dist/}"
          new_path="/photo-diary/${public_font#dist/}"
          while IFS= read -r bundle; do
            sed -i "s|${old_path}|${new_path}|g" "$bundle"
          done < <(find dist/_expo -type f -name '*.js')
          grep -R -F "$new_path" dist/_expo
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
